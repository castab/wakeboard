name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Windows executable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Determine build mode
        id: release
        shell: pwsh
        run: |
          $semanticVersionTag = '^refs/tags/v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(?:-(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)(?:\.(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*))*)?(?:\+[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$'
          $isRelease = $env:GITHUB_EVENT_NAME -eq 'push' -and $env:GITHUB_REF -match $semanticVersionTag
          $version = if ($isRelease) { $Matches[1] } else { 'dev' }
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Building version $version (release: $isRelease)"

      - name: Run dry-run build and tests
        if: steps.release.outputs.is_release != 'true'
        run: docker build --file build/Dockerfile --target test .

      - name: Run tests and build release executable
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        run: ./scripts/build.ps1 -Output artifacts/win-x64 -Version ${{ steps.release.outputs.version }}

      - name: Verify executable
        if: steps.release.outputs.is_release == 'true'
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "artifacts/win-x64/Wakeboard.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Build completed without producing Wakeboard.exe."
          }
          Write-Host "Verified $executable ($((Get-Item -LiteralPath $executable).Length) bytes)"

      - name: Upload Windows executable for tagged release
        if: steps.release.outputs.is_release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: Wakeboard-win-x64-v${{ steps.release.outputs.version }}
          path: artifacts/win-x64/Wakeboard.exe
          if-no-files-found: error
