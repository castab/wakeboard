name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    name: Test and build Windows executable
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run tests and build executable
        shell: pwsh
        run: ./scripts/build.ps1 -Output artifacts/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $executable = Join-Path $PWD "artifacts/win-x64/Wakeboard.exe"
          if (-not (Test-Path -LiteralPath $executable -PathType Leaf)) {
            throw "Build completed without producing Wakeboard.exe."
          }
          Write-Host "Verified $executable ($((Get-Item -LiteralPath $executable).Length) bytes)"

      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: Wakeboard-win-x64
          path: artifacts/win-x64/Wakeboard.exe
          if-no-files-found: error
